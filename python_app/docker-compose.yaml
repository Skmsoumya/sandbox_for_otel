services:
  redis:
    image: redis:8.8.1-alpine
    ports:
      - 6379:6379
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: 6379
      REDIS_HOST: redis
    command: >
      sh -c 'redis-server --requirepass "$$REDIS_PASSWORD"'

  db:
    image: postgres:18.4
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql

  server:
    build:
      context: .
      target: dev
    ports:
      - 8000:8000
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      redis_port: 6379
    depends_on:
      - redis
      - db
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /var/app
          initial_sync: true
        - action: rebuild
          path: requirements.txt

volumes:
  postgres-data: